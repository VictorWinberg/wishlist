
services:
  wishlist:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      # Reach Postgres running on the host (not inside compose)
      DATABASE_URL: postgres://postgres:password@host.docker.internal:5432/wishlist
      PORT: "3000"
      NODE_ENV: production
    extra_hosts:
      - "host.docker.internal:host-gateway"
